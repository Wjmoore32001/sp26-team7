<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Instructor Profile</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <link href="../assets/css/theme.css" rel="stylesheet">
  <script defer src="../assets/js/include-nav.js" data-nav="instructor"></script>
  <script defer src="profile.js"></script>
</head>

<body>
  <div id="nav-placeholder"></div>

  <div class="container text-center">
    <div class="row mt-3">
      <div class="col p-1 bg-body-tertiary border border-primary-subtle rounded-3">
        <h1 class="text-light">Instructor Profile</h1>
      </div>
    </div>

    <div class="row mt-4">
      <div class="col-lg-8 mx-auto">
        <div class="p-4 bg-body-tertiary border border-primary-subtle rounded-3 text-start">
          <div id="profile-message"></div>

          <div id="profile-content" class="d-none">
            <p class="mb-2"><strong>Role:</strong> <span id="profile-role"></span></p>
            <p class="mb-4"><strong>Instructor ID:</strong> <span id="profile-instructor-id"></span></p>

            <div class="d-flex gap-2 flex-wrap">
              <a href="/instructor/my-classes.html" class="btn btn-primary">Back to My Classes</a>
              <a href="/logout" class="btn btn-outline-danger">Sign Out</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
